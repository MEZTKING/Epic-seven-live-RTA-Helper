<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Which window is the game?</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 18px; background: #12131a; color: #e8e9ef; font: 15px/1.5 system-ui, 'Segoe UI', sans-serif; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { margin: 0 0 14px; color: #a6a9b8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    button.src { all: unset; cursor: pointer; display: block; background: #1b1d27; border: 2px solid #2c2f3d; border-radius: 10px; padding: 8px; }
    button.src:hover, button.src:focus-visible { border-color: #c9a24a; }
    button.src img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #0b0c11; border-radius: 6px; }
    button.src span { display: block; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button.src small { color: #a6a9b8; }
    h2 { font-size: 15px; margin: 20px 0 8px; color: #c9a24a; }
    .bar { display: flex; gap: 10px; margin-top: 18px; }
    .bar button { background: #262938; color: inherit; border: 1px solid #3a3e52; border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Which window is the game?</h1>
  <p id="why">Click the emulator or Steam game window. The app then reads only that window, even when other windows cover it,
    and the overlay follows it when you move or resize it. You only do this once.</p>
  <h2>Windows</h2>
  <div id="windows" class="grid">Loading…</div>
  <h2>Whole screen (if the game window isn't listed)</h2>
  <div id="screens" class="grid"></div>
  <div class="bar"><button id="refresh">Refresh list</button><button id="cancel">Cancel</button></div>
  <script>
    const card = (s) => {
      const b = document.createElement('button');
      b.className = 'src';
      b.title = s.name;
      b.innerHTML = `<img alt="" src="${s.thumb}"><span></span>`;
      b.querySelector('span').textContent = s.name;
      if (s.guess) b.querySelector('span').insertAdjacentHTML('beforeend', ' <small>(looks like the game)</small>');
      b.onclick = () => window.E7Desktop.choose({ mode: s.kind, id: s.id, name: s.name, displayId: s.displayId });
      return b;
    };
    async function load() {
      const list = await window.E7Desktop.sources();
      const w = document.getElementById('windows');
      const sc = document.getElementById('screens');
      w.innerHTML = sc.innerHTML = '';
      const wins = list.filter((s) => s.kind === 'window');
      wins.sort((a, b) => (b.guess ? 1 : 0) - (a.guess ? 1 : 0));
      wins.forEach((s) => w.appendChild(card(s)));
      if (!wins.length) w.textContent = 'No windows found. Is the game open (and not minimized)?';
      list.filter((s) => s.kind === 'screen').forEach((s) => sc.appendChild(card(s)));
    }
    const why = new URLSearchParams(location.search).get('why');
    if (why) document.getElementById('why').textContent = why;
    document.getElementById('refresh').onclick = load;
    document.getElementById('cancel').onclick = () => window.E7Desktop.choose(null);
    load();
  </script>
</body>
</html>
