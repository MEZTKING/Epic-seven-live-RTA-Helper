# Builds the Windows desktop app (portable .exe) on a GitHub Windows machine.
#  - Every push that changes the app: the .exe is attached to the run as a download ("Artifacts").
#  - Pushing a tag like v0.1.0: the .exe is also attached to a GitHub Release.
#  - Can also be started by hand: Actions tab -> "Build Windows app" -> Run workflow.
name: Build Windows app
on:
  push:
    branches: [main, ccr-2c9db930-kqvr1r]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'js/**'
      - 'css/**'
      - '*.html'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'docs/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:
permissions:
  contents: write # only used to attach the .exe to a Release when a v* tag is pushed
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  build-windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist
      - name: List build output
        shell: pwsh
        run: Get-ChildItem dist -Filter *.exe | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: Epic-7-Engine-windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Attach to Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
