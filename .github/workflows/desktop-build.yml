# Builds the Windows desktop app on a GitHub Windows machine and publishes it as a Release,
# which is where the app's in-app updater (desktop/updater.js) looks for new versions.
#  - Every push that changes the app: version 0.1.<run number>, installer + portable .exe,
#    published as Release v0.1.<run number> (marked "latest") and attached to the run ("Artifacts").
#  - Can also be started by hand: Actions tab -> "Build Windows app" -> Run workflow.
name: Build Windows app
on:
  push:
    branches: [main, ccr-2c9db930-kqvr1r]
    paths:
      - 'desktop/**'
      - 'js/**'
      - 'css/**'
      - '*.html'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'docs/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:
permissions:
  contents: write # to create the Release (tag v0.1.<run number>) with the built files
concurrency:
  group: desktop-build
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  build-windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      APP_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Set version
        run: npm version ${{ env.APP_VERSION }} --no-git-tag-version --allow-same-version
      - run: npm run dist
      - name: List build output
        shell: pwsh
        run: Get-ChildItem dist -File | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: Epic-7-Engine-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 30
      - name: Publish Release (used by the in-app updater)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Epic 7 Engine ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          body: |
            Automatic build of commit ${{ github.sha }}. What changed: see DEVLOG.md.
            **Epic-7-Engine-Setup-${{ env.APP_VERSION }}.exe**: installer (recommended; updates itself).
            **Epic-7-Engine-${{ env.APP_VERSION }}-portable.exe**: no install; also updates itself from the menu.
          files: |
            desktop/dist/Epic-7-Engine-Setup-${{ env.APP_VERSION }}.exe
            desktop/dist/Epic-7-Engine-Setup-${{ env.APP_VERSION }}.exe.blockmap
            desktop/dist/latest.yml
            desktop/dist/Epic-7-Engine-${{ env.APP_VERSION }}-portable.exe
          fail_on_unmatched_files: true
