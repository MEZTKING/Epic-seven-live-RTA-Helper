# Publishes ONLY the Guild War page to GitHub Pages (DEVLOG #37), so guildmates without the desktop app can see and
# edit the shared war plan in a browser: https://meztking.github.io/Epic-seven-live-RTA-Helper/ (opens guild.html).
# Everything else (RTA, Gear, Live, overlay, reading the game) is the desktop app.
# sw.js is the retired service worker: it clears the old offline web app from phones that installed it.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main, ccr-2c9db930-kqvr1r]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site/docs
          cp -r guild.html icon.svg sw.js firestore.rules css js _site/
          cp docs/GUILD_SETUP.md _site/docs/
          # the old addresses (home, RTA, Gear, Live): "moved to the desktop app" (save old RTA data, then Guild War)
          for p in index rta gear live; do cp tools/web/moved.html _site/$p.html; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
