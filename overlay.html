<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbis Lens · Overlay</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    html, body { background: transparent !important; overflow: hidden; height: 100%; }
    body.preview { background: #0b0d14 !important; }
    #layers { position: fixed; inset: 0; pointer-events: none; }
    .ov { position: absolute; pointer-events: none; font: 13px/1.35 system-ui, sans-serif; color: #fff; }
    .ov-card { background: rgba(12, 14, 22, .86); border: 1px solid rgba(201, 162, 74, .7); border-radius: 8px; padding: 6px 8px; min-width: 170px; max-width: 280px; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
    .ov-card b { color: #f0d48a; }
    .ov-card .l { color: #cfd2de; font-size: 12px; }
    .ov-label { background: rgba(12, 14, 22, .8); border-radius: 4px; padding: 1px 5px; font-weight: 700; font-size: 12px; }
    .ov .gwdot { width: 14px; height: 14px; }
    /* "working…" card: the app is reading something that takes a while, or needs the user (DEVLOG #56) */
    .ov-busy { background: rgba(12, 14, 22, .9); border: 1px solid rgba(120, 170, 255, .7); border-radius: 16px; padding: 5px 12px 5px 9px; font-weight: 600;
      display: flex; align-items: center; gap: 8px; white-space: nowrap; transform: translateX(-50%); box-shadow: 0 2px 10px rgba(0,0,0,.5); }
    .ov-busy.done { border-color: rgba(127, 224, 166, .7); }
    .ov-busy.ask { border-color: rgba(240, 212, 138, .9); }
    .ov-busy .spin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid rgba(120,170,255,.3); border-top-color: #9cc0ff; animation: ovspin .8s linear infinite; flex: none; }
    .ov-busy .mark { color: #7fe0a6; flex: none; }
    .ov-busy.ask .mark { color: #f0d48a; }
    @keyframes ovspin { to { transform: rotate(360deg); } }
    .preview-note { position: fixed; left: 12px; bottom: 10px; color: #9a9db0; font-size: 12px; }
    /* "is it working?" badge: shown for a few seconds when the overlay comes on or is tested */
    .ov-badge { position: fixed; left: 10px; top: 44px; padding: 4px 10px; border-radius: 12px; background: rgba(12,14,22,.85); color: #7fe0a6;
      font: 600 13px system-ui, sans-serif; border: 1px solid rgba(127,224,166,.5); pointer-events: none; transition: opacity .6s; opacity: 0; }
    .ov-badge.on { opacity: 1; }
    .ov-frame { position: fixed; inset: 0; border: 2px dashed rgba(201,162,74,.35); pointer-events: none; display: none; }
    /* clickable markers (DEVLOG #73): hover = what is known, click a spelling or type one = fixed in place */
    .ov-pin { pointer-events: auto; cursor: pointer; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font: 700 13px system-ui, sans-serif; color: #12131a; background: #9aa0b4; border: 2px solid rgba(12,14,22,.9); box-shadow: 0 1px 6px rgba(0,0,0,.6); }
    .ov-pin.yellow { background: #f0d48a; } .ov-pin.green, .ov-pin.proven { background: #7fe0a6; } .ov-pin.red { background: #ff8a8a; } .ov-pin.grey { background: #6b7083; }
    .ov-pin:hover, .ov-pin.open { outline: 2px solid #fff; }
    #ov-pop { position: fixed; display: none; pointer-events: auto; z-index: 5; background: rgba(12,14,22,.95); border: 1px solid rgba(201,162,74,.8); border-radius: 8px;
      padding: 8px 10px; min-width: 200px; max-width: 300px; color: #fff; font: 13px/1.35 system-ui, sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,.6); }
    #ov-pop b { color: #f0d48a; }
    #ov-pop .l { color: #cfd2de; font-size: 12px; }
    #ov-pop .opts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    #ov-pop button { font: 12px system-ui, sans-serif; padding: 3px 8px; border-radius: 6px; border: 1px solid #3a3f55; background: #1d2130; color: #fff; cursor: pointer; }
    #ov-pop button:hover { border-color: #f0d48a; }
    #ov-pop input { margin-top: 6px; width: 100%; box-sizing: border-box; font: 13px system-ui, sans-serif; padding: 4px 6px; border-radius: 6px; border: 1px solid #3a3f55; background: #0f1220; color: #fff; }
    #ov-pop .ok { color: #7fe0a6; margin-top: 4px; font-size: 12px; }
    body.preview .ov-frame { display: block; }
  </style>
</head>
<body>
  <div class="ov-frame"></div>
  <div id="layers"></div>
  <div id="ov-pop"></div>
  <div class="preview-note" id="note"></div>
  <script>
    (function () {
      const desktop = /desktop=1/.test(location.search);
      if (!desktop) document.body.classList.add('preview');
      const note = document.getElementById('note');
      note.textContent = desktop ? '' : 'Overlay preview: in the desktop app this layer is transparent and sits on top of the game. The dashed box = the captured game area.';
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const layers = {};
      const root = document.getElementById('layers');
      // readers measure inside the game area (js/game-area.js); map back to the whole screen
      // desktop app in window mode: this layer sits exactly on the game window, so no mapping
      // window mode AND the overlay is really on the game window (tracked). When the tracker failed the overlay covers the
      // whole display (desktop/main.js fallback), so window fractions would be off: then no mapping (review, DEVLOG #40)
      const capture = () => { try { return (window.E7Desktop && E7Desktop.capture()) || {}; } catch (_) { return {}; } };
      const windowMode = () => { const c = capture(); return c.mode === 'window' && !!c.tracked; };
      let lastTracked = null;
      setInterval(() => { const t = windowMode(); if (t !== lastTracked) { lastTracked = t; draw(); } }, 2000);
      if (window.E7Desktop) E7Desktop.onCapture(() => draw());
      // overlay text size (desktop: Overlay → Bigger/Smaller overlay text). Page zoom is shared with the main window,
      // so items are scaled by overlayZoom / zoom; positions are untouched (transform from the side facing the box).
      let scale = 1;
      const readZoom = (z) => { scale = z && z.zoom ? z.overlayZoom / z.zoom : 1; };
      if (window.E7Desktop && E7Desktop.zoom) { try { readZoom(E7Desktop.zoom()); } catch (_) {} E7Desktop.onZoom((z) => { readZoom(z); draw(); }); }
      const area = () => {
        if (windowMode()) {
          // the overlay covers the whole game window; where the game is inside it (title bar cut off) comes from the
          // game watcher (js/game-area.js windowFrame, any window size); before that, the old 16:9 rule
          try {
            const f = JSON.parse(localStorage.getItem('e7-window-frame') || 'null');
            if (f && f.w > 0.5 && f.h > 0.5) return f;
          } catch (_) { /* fall back */ }
          const W = innerWidth, H = innerHeight, b = Math.round(W / 450), cw = W - 2 * b, ch = Math.round((cw * 9) / 16);
          return H - ch < 8 ? { x: 0, y: 0, w: 1, h: 1 } : { x: b / W, y: Math.max(0, H - ch - b) / H, w: cw / W, h: ch / H };
        }
        if (capture().mode === 'window') return { x: 0, y: 0, w: 1, h: 1 }; // window capture, tracker failed: whole display
        try {
          const a = JSON.parse(localStorage.getItem('e7-game-area') || 'null');
          return a && !a.full ? a : { x: 0, y: 0, w: 1, h: 1 };
        } catch (_) {
          return { x: 0, y: 0, w: 1, h: 1 };
        }
      };
      addEventListener('storage', (e) => (e.key === 'e7-game-area' || e.key === 'e7-window-frame') && draw());
      function draw() {
        const W = innerWidth, H = innerHeight;
        const A = desktop ? area() : { x: 0, y: 0, w: 1, h: 1 };
        let nBusy = 0;
        // (not while a name is being typed in the marker's card: the redraw would take the box away)
        if (pop.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') return;
        pins = [];
        root.innerHTML = Object.values(layers).flat().map((it) => {
          let x = (A.x + it.x * A.w) * W, y = (A.y + it.y * A.h) * H;
          if (it.dxH) x += it.dxH * A.h * H; // an offset in the game's height (the same at any window shape), DEVLOG #101
          if (it.kind === 'busy') {
            // centred at the top of the game, one under the other
            const top = y + 30 * nBusy++;
            return `<div class="ov ov-busy${it.done ? ' done' : ''}${it.ask ? ' ask' : ''}" data-busy="1" style="left:${x}px;top:${top}px">${it.done ? `<span class="mark">${it.ask ? '!' : '✓'}</span>` : '<span class="spin"></span>'}<span>${esc(it.title || 'Working…')}</span></div>`;
          }
          const w = (it.w || 0) * A.w * W, h = (it.h || 0) * A.h * H;
          const side = it.side || 'right';
          let style = '';
          let origin = 'left top';
          if (it.kind === 'dot') { style = `left:${x + w + 4}px;top:${y + h / 2 - 7}px`; origin = 'left center'; }
          else if (side === 'right') style = `left:${x + w + 6}px;top:${y}px`;
          else if (side === 'left') { style = `right:${W - x + 6}px;top:${y}px`; origin = 'right top'; }
          else if (side === 'below') style = `left:${x}px;top:${y + h + 4}px`;
          else { style = `left:${x}px;bottom:${H - y + 4}px`; origin = 'left bottom'; }
          if (scale !== 1) style += `;transform:scale(${scale});transform-origin:${origin}`;
          const dot = it.level ? `<span class="gwdot ${esc(it.level)}"></span> ` : '';
          const box = `data-bx="${x}" data-by="${y}" data-bw="${w}" data-bh="${h}"`;
          if (it.kind === 'dot') return `<div class="ov" ${box} style="${style}">${dot}</div>`;
          if (it.kind === 'pin') {
            pins.push(it);
            const k = esc(it.pin.layer + ':' + it.pin.id);
            return `<div class="ov ov-pin ${esc(it.level || 'grey')}${popKey === it.pin.layer + ':' + it.pin.id ? ' open' : ''}" data-busy="1" data-pin="${k}" style="left:${x - 10}px;top:${y - 10}px" title="${esc(it.pin.name || '')}">${esc(it.title || '')}</div>`;
          }
          if (it.kind === 'label') return `<div class="ov ov-label" ${box} style="${style}">${dot}${esc(it.title)}</div>`;
          return `<div class="ov ov-card" ${box} style="${style}"><div>${dot}<b>${esc(it.title || '')}</b></div>${(it.lines || []).map((l) => `<div class="l">${esc(l)}</div>`).join('')}</div>`;
        }).join('');
        // keep everything on screen: flip to the other side of its box, then clamp
        for (const el of root.children) {
          if (el.dataset.busy) continue;
          const r = el.getBoundingClientRect();
          const bx = +el.dataset.bx, bw = +el.dataset.bw;
          if (r.right > W - 2) { el.style.right = ''; el.style.left = Math.max(2, bx - r.width - 6) + 'px'; }
          else if (r.left < 2) { el.style.right = ''; el.style.left = Math.min(W - r.width - 2, bx + bw + 6) + 'px'; }
          const r2 = el.getBoundingClientRect();
          if (r2.bottom > H - 2) { el.style.bottom = ''; el.style.top = Math.max(2, H - r2.height - 2) + 'px'; }
          if (r2.top < 2) { el.style.bottom = ''; el.style.top = '2px'; }
        }
      }
      const chan = new BroadcastChannel('e7-overlay');
      // ---- clickable markers (DEVLOG #73) ---------------------------------------------------------------------------
      // The overlay lets every click through to the game, except while the pointer is on one of its markers or their
      // card (desktop: setIgnoreMouseEvents is switched off then), and it takes the keyboard only while a name is typed.
      // What is clicked goes back to the page that posted the marker ({ action: 'pick', layer, id, key, value }); the
      // game never gets any input from here.
      const pop = document.getElementById('ov-pop');
      let pins = [];
      let popKey = null;
      let hideTimer = null;
      const interactive = (on) => { try { if (window.E7Desktop && E7Desktop.overlayMouse) E7Desktop.overlayMouse(!!on); } catch (_) {} };
      const keyboard = (on) => { try { if (window.E7Desktop && E7Desktop.overlayFocus) E7Desktop.overlayFocus(!!on); } catch (_) {} };
      function closePop() {
        clearTimeout(hideTimer);
        popKey = null;
        pop.style.display = 'none';
        keyboard(false);
        interactive(false);
        for (const el of root.querySelectorAll('.ov-pin.open')) el.classList.remove('open');
      }
      function openPop(el) {
        const key = el.dataset.pin;
        const it = pins.find((p) => p.pin.layer + ':' + p.pin.id === key);
        if (!it) return;
        clearTimeout(hideTimer);
        interactive(true);
        if (popKey !== key) {
          popKey = key;
          const P = it.pin;
          pop.innerHTML = `<div><b>${esc(P.name || '(name not read)')}</b></div>${(P.lines || []).map((l) => `<div class="l">${esc(l)}</div>`).join('')}` +
            (P.options && P.options.length ? `<div class="l" style="margin-top:6px">Use this spelling:</div><div class="opts">${P.options.map((o) => `<button type="button" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>` : '') +
            (P.input ? `<input type="text" placeholder="Type the name, then Enter" value="" />` : '') + '<div class="ok"></div>';
          pop.querySelectorAll('button[data-v]').forEach((b) => (b.onclick = () => send(it, b.dataset.v)));
          const inp = pop.querySelector('input');
          if (inp) {
            inp.onfocus = () => keyboard(true);
            inp.onkeydown = (e) => {
              if (e.key === 'Enter' && inp.value.trim()) send(it, inp.value.trim());
              if (e.key === 'Escape') closePop();
            };
          }
        }
        for (const p of root.querySelectorAll('.ov-pin.open')) p.classList.remove('open');
        el.classList.add('open');
        const r = el.getBoundingClientRect();
        pop.style.display = 'block';
        const pw = pop.offsetWidth, ph = pop.offsetHeight;
        // to the right of the marker, going up from it: clear of the red circle and the name below it (DEVLOG #101)
        let left = r.right + 8, top = r.bottom - ph;
        if (left + pw > innerWidth - 4) left = Math.max(4, r.left - pw - 8);
        if (top < 4) top = 4;
        if (top + ph > innerHeight - 4) top = Math.max(4, innerHeight - ph - 4);
        pop.style.left = left + 'px';
        pop.style.top = top + 'px';
      }
      function send(it, value) {
        chan.postMessage({ action: 'pick', layer: it.pin.layer, id: it.pin.id, key: it.pin.key, value });
        const ok = pop.querySelector('.ok');
        if (ok) ok.textContent = `✓ "${value}" saved`;
        keyboard(false);
        setTimeout(closePop, 900);
      }
      const leaveSoon = () => {
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => { if (!(pop.contains(document.activeElement) && document.activeElement.tagName === 'INPUT')) closePop(); }, 450);
      };
      root.addEventListener('mouseover', (e) => { const el = e.target.closest && e.target.closest('.ov-pin'); if (el) openPop(el); });
      root.addEventListener('mouseout', (e) => { if (e.target.closest && e.target.closest('.ov-pin')) leaveSoon(); });
      root.addEventListener('click', (e) => { const el = e.target.closest && e.target.closest('.ov-pin'); if (el) { openPop(el); const i = pop.querySelector('input'); if (i) i.focus(); } });
      pop.addEventListener('mouseenter', () => { clearTimeout(hideTimer); interactive(true); });
      pop.addEventListener('mouseleave', leaveSoon);
      // a layer lives as long as its page keeps repeating it (js/overlay-bus.js, every 5 s): not heard for 15 s -> gone
      const heard = {};
      chan.onmessage = (e) => {
        if (!e.data || !e.data.layer) return;
        heard[e.data.layer] = Date.now();
        const same = e.data.keep && JSON.stringify(layers[e.data.layer] || []) === JSON.stringify(e.data.items || []);
        layers[e.data.layer] = e.data.items || [];
        if (!same) draw();
      };
      setInterval(() => {
        let gone = false;
        for (const k of Object.keys(layers)) {
          if (k !== 'test' && layers[k].length && Date.now() - (heard[k] || 0) > 15000) {
            layers[k] = [];
            gone = true;
          }
        }
        if (gone) draw();
      }, 3000);
      chan.postMessage({ hello: true });
      addEventListener('resize', draw);
      // "is it working?": a small badge for a few seconds when the overlay starts (desktop), and a test card on request
      const badge = document.createElement('div');
      badge.className = 'ov-badge';
      badge.textContent = '✓ Orbis Lens overlay';
      document.body.appendChild(badge);
      let badgeTimer = null;
      const showBadge = (text, ms = 6000) => {
        badge.textContent = text || '✓ Orbis Lens overlay';
        badge.classList.add('on');
        clearTimeout(badgeTimer);
        badgeTimer = setTimeout(() => badge.classList.remove('on'), ms);
      };
      // desktop: the app sends 'overlay-badge' the first time the overlay really appears on screen
      function testCard() {
        showBadge('✓ Orbis Lens overlay is working', 5000);
        layers.test = [{ x: 0.36, y: 0.42, w: 0.0, h: 0.0, kind: 'card', side: 'right', level: 'green', title: '✓ The overlay is working', lines: ['Suggestions, enemy speeds, gear verdicts and', 'Guild War dots appear on the game like this.', 'This card goes away in 5 seconds.'] }];
        draw();
        setTimeout(() => { delete layers.test; draw(); }, 5000);
      }
      chan.addEventListener('message', (e) => e.data && e.data.test && testCard());
      if (window.E7Desktop && E7Desktop.onHotkey) E7Desktop.onHotkey((n) => (n === 'overlay-test' ? testCard() : n === 'overlay-badge' && showBadge()));
      window.E7OverlayView = { layers, draw, testCard, _openPin: (key) => { const el = root.querySelector(`[data-pin="${key}"]`); if (el) openPop(el); return !!el; } };
    })();
  </script>
</body>
</html>
